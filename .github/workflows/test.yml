name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "fonttools[woff]"
      # Node 测试只依赖内置模块；字体集成测试使用上面安装的 FontTools CLI。
      - run: npm test
